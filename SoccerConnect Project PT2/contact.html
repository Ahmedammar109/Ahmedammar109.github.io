<!DOCTYPE html>

    <title>SoccerConnect - Contact</title>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <!-- Navigation links for different pages -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="teams.html">Teams</a></li>
                <li><a href="players.html">Players</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Get in Touch</h2>
        <p>If you have any inquiries, please fill out the form below:</p>
        <form>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" required></textarea><br>
            <input type="submit" value="Submit">
        </form>
        <!-- Contact image -->
        <img src="https://tse3.mm.bing.net/th?id=OIP.LzL9pWLajQukyhfDwyYqEwHaBp&pid=Api&P=0&h=220" alt="Contact Us" class="contact-image">
